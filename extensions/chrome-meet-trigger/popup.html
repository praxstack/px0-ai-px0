<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 250px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      color: #1a1a1a;
      background: #fafafa;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9ca3af;
    }
    .badge.active {
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }
    .badge.ready {
      background: #10b981;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }
    .info {
      font-size: 12px;
      color: #555;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .status-box {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: #6b7280;
    }
    .val {
      font-weight: 500;
    }
    .cmd {
      background: #f3f4f6;
      padding: 4px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      display: block;
      margin-top: 6px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h3>
    <span id="indicator" class="badge"></span>
    px0 Meeting Sync
  </h3>
  <p class="info">Auto-records Meet & Zoom calls to <code>~/.px0/meetings/</code> and transcribes to px0 brain.</p>
  
  <div class="status-box">
    <div class="status-row">
      <span class="label">Daemon:</span>
      <span id="daemon-status" class="val">Checking...</span>
    </div>
    <div class="status-row">
      <span class="label">Recording:</span>
      <span id="rec-status" class="val">Idle</span>
    </div>
    <div id="title-row" class="status-row" style="display: none;">
      <span class="label">Meeting:</span>
      <span id="meeting-title" class="val"></span>
    </div>
  </div>

  <div id="offline-help" style="display: none;">
    <span class="info" style="color: #b91c1c;">px0 daemon is not running. Start it in terminal:</span>
    <code class="cmd">px0 brain listen</code>
  </div>

  <script src="popup.js"></script>
</body>
</html>
